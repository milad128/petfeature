<style>
/* ── Roadmap level page (v2 design) ──────────────────────────────── */
:root {
  --sprout: #8fbf86;
}

/* Gantt map */
.gantt-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px 18px 16px;
  overflow-x: auto;
  --gantt-supp: #93aed4;
  --gantt-supp-bg: color-mix(in srgb, #93aed4 12%, transparent);
  --gantt-supp-bd: color-mix(in srgb, #93aed4 28%, transparent);
  --gantt-core-bg: color-mix(in srgb, var(--accent) 12%, transparent);
  --gantt-core-bd: color-mix(in srgb, var(--accent) 28%, transparent);
}
.gantt-wrap::-webkit-scrollbar { height: 8px; }
.gantt-wrap::-webkit-scrollbar-thumb { background: rgba(236,229,220,.16); border-radius: 8px; }
.gantt-band-markers {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 12px;
  min-width: 640px;
  margin-bottom: 8px;
}
.gantt-bands { position: relative; height: 22px; }
.gantt-band {
  position: absolute;
  top: 0;
  bottom: 0;
  border-radius: 6px;
  font-size: .68rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  padding-inline: 8px;
  white-space: nowrap;
}
.gantt-band--core {
  inset-inline-start: 0;
  background: var(--gantt-core-bg);
  color: var(--accent);
  border: 1px solid var(--gantt-core-bd);
}
.gantt-band--supp {
  background: var(--gantt-supp-bg);
  color: var(--gantt-supp);
  border: 1px solid var(--gantt-supp-bd);
}
.gantt-axis {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 12px;
  margin-bottom: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  min-width: 640px;
}
.gantt-axis-label { font-size: .72rem; color: var(--faint); }
.gantt-weeks {
  display: grid;
  gap: 0;
  font-size: .62rem;
  color: var(--faint);
  text-align: center;
}
.gantt-weeks span:nth-child(5n) { color: var(--muted); font-weight: 600; }
.gantt-row {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 12px;
  align-items: center;
  min-width: 640px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.gantt-row:last-child { border-bottom: 0; }
.gantt-name {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: .82rem;
  font-weight: 600;
  line-height: 1.6;
  text-decoration: none;
  color: inherit;
}
.gantt-name:hover { color: var(--accent); }
.gantt-station-num {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .72rem;
  font-weight: 700;
  flex-shrink: 0;
}
.gantt-station-num--core {
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  color: var(--accent);
}
.gantt-station-num--supp {
  background: var(--gantt-supp-bg);
  color: var(--gantt-supp);
}
.gantt-track {
  position: relative;
  height: 28px;
  background: rgba(236,229,220,.04);
  border-radius: 8px;
  overflow: hidden;
}
.gantt-bar {
  position: absolute;
  top: 4px;
  bottom: 4px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .68rem;
  font-weight: 700;
  color: #171210;
  white-space: nowrap;
  padding: 0 6px;
  text-decoration: none;
}
.gantt-bar--core { background: var(--accent); }
.gantt-bar--supp { background: var(--gantt-supp); }
.gantt-legend {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 16px;
  font-size: .78rem;
  color: var(--muted);
}
.gantt-legend i {
  display: inline-block;
  width: 14px;
  height: 8px;
  border-radius: 4px;
  margin-inline-end: 6px;
  vertical-align: middle;
}

/* Layout primitives */
.ra-pad { padding-left: 32px; padding-right: 32px; }
.ra-inner { max-width: 1120px; margin: 0 auto; }
.ra-section { border-top: 1px solid var(--border); scroll-margin-top: 70px; }

/* Hero 2-col grid */
.ra-hero-grid { display: grid; grid-template-columns: 1fr 330px; gap: 56px; align-items: start; }

/* Stats facts grid */
.ra-facts { display: grid; gap: 1px; background: var(--border); border-radius: 10px; overflow: hidden; }
.ra-fact { background: var(--raise); padding: 12px 14px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.ra-fact-lbl { font-size: .76rem; color: var(--faint); }
.ra-fact-val { font-size: .98rem; font-weight: 700; }

/* Section headers */
.ra-section-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 2px solid color-mix(in srgb, var(--accent) 30%, transparent); }
.ra-section-head--plain { border-bottom-color: var(--border-2); }
.ra-section-badge { font-size: .72rem; font-weight: 700; border-radius: 6px; padding: 3px 10px; }
.ra-section-title { font-size: 1.45rem; font-weight: 800; }
.ra-section-meta { font-size: .8rem; color: var(--muted); margin-inline-start: auto; }

/* Note paragraphs */
.ra-note { font-size: .92rem; color: var(--muted); max-width: 720px; line-height: 2.05; margin-top: 20px; }

/* 2-col split (left label / right body) */
.ra-split { display: grid; grid-template-columns: 280px 1fr; gap: 40px; align-items: start; }
.ra-split-body { border-inline-start: 1px dashed var(--border-2); padding-inline-start: 32px; }

/* Station rows */
.ra-station { display: grid; grid-template-columns: 280px 1fr; gap: 40px; padding: 34px 0; border-bottom: 1px solid var(--border); scroll-margin-top: 70px; }
.ra-rail { position: sticky; top: 24px; align-self: start; }
.ra-rail-n { width: 30px; height: 30px; border-radius: 9px; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: .85rem; font-weight: 700; flex-shrink: 0; }

/* Chip row */
.ra-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.ra-chip-read   { font-size: .78rem; color: var(--muted); background: rgba(236,229,220,.05); border-inline-start: 3px solid var(--muted); border-radius: 0 6px 6px 0; padding: 3px 10px; white-space: nowrap; }
.ra-chip-sprint { font-size: .78rem; color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); border-inline-start: 3px solid var(--accent); border-radius: 0 6px 6px 0; padding: 3px 10px; white-space: nowrap; }
.ra-chip-mat    { font-size: .78rem; color: var(--sprout); background: color-mix(in srgb, var(--sprout) 10%, transparent); border-inline-start: 3px solid var(--sprout); border-radius: 0 6px 6px 0; padding: 3px 10px; white-space: nowrap; }

/* Resource rows */
.ra-res { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; }
.ra-res-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.ra-no-link { font-size: .68rem; color: var(--faint); border: 1px dashed var(--border-2); border-radius: 5px; padding: 2px 8px; white-space: nowrap; }
.ra-tag-req { font-size: .72rem; font-weight: 700; color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, transparent); border-radius: 6px; padding: 3px 9px; white-space: nowrap; }
.ra-tag-opt { font-size: .72rem; font-weight: 600; color: var(--faint); border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; white-space: nowrap; }
.ra-tag-meta { font-size: .74rem; color: var(--muted); background: rgba(236,229,220,.05); border-radius: 6px; padding: 3px 9px; white-space: nowrap; }

/* Asks table */
.ra-asks-scroll { overflow-x: auto; }
.ra-asks-scroll::-webkit-scrollbar { height: 8px; }
.ra-asks-scroll::-webkit-scrollbar-thumb { background: rgba(236,229,220,.16); border-radius: 8px; }
.ra-asks-table { width: 100%; border-collapse: collapse; min-width: 640px; }
.ra-asks-table th { text-align: start; font-size: .72rem; font-weight: 600; color: var(--faint); padding: 12px 14px; border-bottom: 1px solid var(--border-2); white-space: nowrap; }
.ra-asks-table th.center { text-align: center; }
.ra-asks-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: .85rem; color: var(--muted); }
.ra-asks-table td.center { text-align: center; white-space: nowrap; }
.ra-asks-table tr:last-child td { border-bottom: none; }
.ra-depth-chip { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 24px; border-radius: 6px; font-size: .8rem; font-weight: 700; }
.ra-depth-none { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 24px; border-radius: 6px; border: 1px dashed var(--border-2); color: var(--faint); font-size: .8rem; }

/* Passive grid rows */
.ra-passive-row { display: grid; grid-template-columns: 220px 40px 1fr; gap: 16px; align-items: baseline; padding: 13px 2px; border-bottom: 1px solid var(--border); }

/* Ladder grid */
.ra-ladder { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }

/* Sticky phase nav */
.ra-phase-nav {
  position: sticky; top: var(--header-h); z-index: 20;
  background: rgba(23,18,16,.92); backdrop-filter: blur(8px);
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
}
.ra-phase-nav-inner {
  max-width: 1120px; margin: 0 auto; padding: 0 32px;
  display: flex; align-items: center; gap: 6px; overflow-x: auto; height: 52px;
}
.ra-phase-link {
  flex-shrink: 0; font-size: .82rem; color: var(--muted); text-decoration: none;
  padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
  transition: color .15s, border-color .15s; white-space: nowrap;
}
.ra-phase-link:hover { color: var(--text); border-color: var(--border-2); text-decoration: none; }

/* Level strip */
.ra-strip-wrap { border-bottom: 1px solid var(--border); background: var(--surface); overflow: hidden; }
.ra-strip { max-width: 1120px; margin: 0 auto; padding: 0 32px; display: flex; gap: 4px; overflow-x: auto; }
.ra-strip::-webkit-scrollbar { height: 6px; }
.ra-strip::-webkit-scrollbar-thumb { background: rgba(236,229,220,.16); border-radius: 6px; }
.ra-strip-btn { flex-shrink: 0; background: none; border: none; cursor: pointer; font-family: inherit; font-size: .82rem; padding: 12px 16px; color: var(--muted); border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; text-decoration: none; display: inline-block; }
.ra-strip-btn:hover { color: var(--text); text-decoration: none; }
.ra-strip-btn[aria-current="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.ra-strip-btn[aria-disabled="true"] { opacity: .45; cursor: default; pointer-events: none; }

/* Responsive */
@media (max-width: 1000px) {
  .ra-hero-grid { grid-template-columns: 1fr !important; gap: 36px !important; }
  .ra-station   { grid-template-columns: 1fr !important; gap: 18px !important; }
  .ra-split     { grid-template-columns: 1fr !important; gap: 24px !important; }
  .ra-split-body { border-inline-start: none !important; padding-inline-start: 0 !important; }
  .ra-rail { position: static !important; }
  .ra-ladder { grid-template-columns: repeat(3, 1fr) !important; }
}
@media (max-width: 760px) {
  .ra-pad { padding-left: 18px !important; padding-right: 18px !important; }
  .ra-res { grid-template-columns: 1fr !important; }
  .ra-res-meta { justify-content: flex-start !important; }
  .ra-passive-row { grid-template-columns: 1fr !important; gap: 6px !important; }
  .ra-ladder { grid-template-columns: repeat(2, 1fr) !important; }
}
</style>
